server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $codearena_api api:8080;
        proxy_pass http://$codearena_api;
        proxy_set_header Host $http_host;
        proxy_read_timeout 32s;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
}
